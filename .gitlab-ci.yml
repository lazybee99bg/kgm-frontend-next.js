build:
  stage: build
  script:
    - yarn
    - yarn next build
    - yarn next export
  artifacts:
    paths:
      - .next
      - out
    expire_in: 1 week
deploy:
  stage: deploy
  script:
    - pwd
    - ls -la
    - rm -rf /home/gitlab-runner/builds/out/* && cp -r out/* /home/gitlab-runner/builds/out/